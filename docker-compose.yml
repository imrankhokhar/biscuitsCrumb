services:
  app:
    build: .
    image: excelorithm-vending:latest
    container_name: excelorithm-vending
    ports:
      - "${HOST_PORT:-8080}:4000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATA_DIR: /data
      # SQLite file (used when FORCE_SQLITE=1). Placeholder still required by Prisma generate.
      DATABASE_URL: ${DATABASE_URL:-file:/data/db/app.db}
      FORCE_SQLITE: ${FORCE_SQLITE:-1}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_D1_DATABASE_ID: ${CLOUDFLARE_D1_DATABASE_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      PUBLIC_DIR: /app/public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      RECEIPT_ENCRYPTION_KEY: ${RECEIPT_ENCRYPTION_KEY:-}
      # Public URL of this app (used for CORS). Use your domain or http://SERVER_IP:8080
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-true}
      # Set to "true" only when HTTPS is enabled in front of the container
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Excelorithm Vending <noreply@excelorithm.com>}
    volumes:
      # Named volume `d1` = persistent DB + uploads + encrypted receipts
      - d1:/data
    restart: unless-stopped

volumes:
  d1:
    name: excelorithm_d1
