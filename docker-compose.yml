services:
  app:
    build: .
    image: excelorithm-vending:latest
    container_name: excelorithm-vending
    ports:
      - "${HOST_PORT:-8080}:4000"
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATA_DIR: /data
      # Durable local SQLite on volume `d1` (NOT Cloudflare D1 — no 5M/100k quotas)
      DATABASE_URL: file:/data/db/app.db
      PUBLIC_DIR: /app/public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      RECEIPT_ENCRYPTION_KEY: ${RECEIPT_ENCRYPTION_KEY:-}
      # Public URL of this app (used for CORS). Use your domain or http://SERVER_IP:8080
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-true}
      # Set to "true" only when HTTPS is enabled in front of the container
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Excelorithm Vending <noreply@excelorithm.com>}
    volumes:
      # Named volume `d1` = persistent DB + uploads + encrypted receipts
      - d1:/data
    restart: unless-stopped

volumes:
  d1:
    name: excelorithm_d1
